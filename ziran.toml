[package]
name = "photos"
tool = "kryon"
entry = "src/app.zi"
module_roots = ["src", "tests"]
bridge_modules = ["app"]

[toolchain]
git = "https://github.com/ziranlang/ziran.git"
ref = "master"

[tool.kryon]
default_profile = "desktop"

[tool.kryon.profiles.desktop]
backend = "desktop"
library = "X11"

[tool.kryon.profiles.portable]
backend = "desktop"
codegen = "zx"

[tool.kryon.profiles.android]
backend = "android"

[tool.kryon.android]
package = "xyz.waozi.photos"
activity = "PhotosActivity"
min_sdk = "28"
abis = "armeabi-v7a,arm64-v8a,x86_64"

[install]
bin = "photos"

[tool.kryon.install]
profile = "desktop"
name = "Photos"
comment = "Private local photos synced with ThinkPad"
categories = "Graphics;Photography;"

[dependencies.kryon]
git = "https://github.com/kryonlabs/kryon.git"
ref = "master"

[dependencies.sqlite]
git = "https://github.com/ziranlang/sqlite.git"
ref = "master"

[dependencies.oqs]
git = "https://github.com/ziranlang/oqs.git"
ref = "master"

[dependencies.libsodium]
git = "https://github.com/jedisct1/libsodium.git"
ref = "stable"
source = true

[dependencies.daochi_client]
git = "https://github.com/ziranlang/daochi-client.git"
ref = "master"

[dependencies.mingcute]
git = "https://github.com/kryonlabs/mingcute.git"
ref = "master"

[dependencies.crypto]
git = "https://github.com/ziranlang/crypto.git"
ref = "master"

[dependencies.clip_tokenizer]
git = "https://github.com/ziranlang/clip-tokenizer.git"
ref = "master"
